# Phainon Distribution Center Client Configuration
# 刻法勒永志不忘。
name: "YcyzClass"
components:
  app:
    allowDiffUpdate: true
    root: "app-$(version)-$(number)/"
    includes:
      - "**"
  launcher:
    root: ""
    includes:
      - "**"
    excludes:
      - "app*/**"
      - "files.json"
variables:
  number: 0
fileRepoRoot: "https://get.classisland.tech/d/YcyzClass-Ningbo-S3/ycyzclass/distribution-v2-dev/repo/"
archiveRoot: "https://get.classisland.tech/d/YcyzClass-Ningbo-S3/ycyzclass/distribution-v2-dev/$(primaryVersion)/$(version)/"
bucketKeyRoot: "ycyzclass/distribution-v2-dev/repo/"
archiveBucketKeyRoot: "ycyzclass/distribution-v2-dev/$(primaryVersion)/$(version)/"
appChangeLogPath: "$(thisFileDir)/doc/ChangeLogs/$(primaryVersion)/$(version)/App.md"
appChangeLogTemplate: |
  $(changeLog)

  ---

  ## 校验和与下载链接

  > [!tip]
  > 内地用户建议前往[YcyzClass 官网](https://github.com/sizhenhualei/ycyzclass/releases)，或通过下方表格中的高速下载链接下载 YcyzClass，以获得更好的下载体验。

  > [!important]
  > 下载时请注意核对文件 SHA512 是否正确。

  $(hashes)